default = "local"

[connections.local]
url = "postgres://postgres:postgres@localhost:5432/postgres"

[connections.local.listen]
channels = ["materials"]

[connections.local.listen.sink]
type = "elasticsearch"
url = "http://localhost:9200"
index = "materials"
id_field = "mat_no"

[connections.local.consume]
source = { type = "rabbitmq", amqp_url = "amqp://guest:guest@localhost:5672/%2F", queue = "pgx-events", exchange = "pgx", routing_key = "pgx.notify" }
sink = { type = "elasticsearch", url = "http://localhost:9200", index = "materials", id_field = "mat_no" }
query_mode = "contract"
max_depth = 8
on_error = "lenient"

[resolvers.material]
sql = "SELECT mat_no, name, status FROM materials WHERE mat_no = $1"
param = "mat_no"

[resolvers.sizes]
sql = "SELECT size_code, mat_no, name FROM sizes WHERE mat_no = ANY($1)"
param = "mat_no"
batch_by = "mat_no"

[resolvers.colorways]
sql = "SELECT colorway_code, mat_no, name, hex FROM colorways WHERE mat_no = ANY($1)"
param = "mat_no"
batch_by = "mat_no"

[resolvers.features]
sql = "SELECT id, mat_no, feature_name, description FROM material_features WHERE mat_no = ANY($1)"
param = "mat_no"
batch_by = "mat_no"

[resolvers.attribute_entries]
sql = "SELECT attr_name, attr_value FROM feature_attributes WHERE feature_id::text = ANY($1)"
param = "id"
batch_by = "id"

# graphql-mutate sink: mirror composed documents into a second Postgres
# database ("DB B"). Create the target first:
#   createdb -h localhost -U postgres warehouse
#   psql -h localhost -U postgres -d warehouse \
#     -c "CREATE TABLE materials_mirror (mat_no TEXT PRIMARY KEY, name TEXT, description TEXT)"
# Then run consume with:
#   --sink graphql-mutate --mutation upsert_material
# (or set sink = { type = "graphql-mutate", mutation = "upsert_material" } above)
#
# [mutations.upsert_material]
# target_url = "postgres://postgres:postgres@localhost:5432/warehouse"
# sql = """
# INSERT INTO materials_mirror (mat_no, name, description)
# VALUES ($1, $2, $3)
# ON CONFLICT (mat_no) DO UPDATE
